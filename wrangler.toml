name = "milkyfrog-web"
main = "worker/index.js"
compatibility_date = "2026-10-31"

[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = ["/googlec0b1348d6b9cc6f8.html"]

[dev]
port = 8788

[[routes]]
pattern = "milkyfrog.vip/*"
zone_name = "milkyfrog.vip"

[[d1_databases]]
binding = "DB"
database_name = "milk-frog-jump"
database_id = "0d52075b-362a-49cd-93ac-f3ecbdc59a68"

# 体验版（trial）专用环境：独立 worker + 独立 D1，测试数据不写进线上库
[env.staging]
name = "milkyfrog-web-staging"
main = "worker/index.js"
compatibility_date = "2026-10-31"

[env.staging.assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "milk-frog-jump-staging"
database_id = "2d11e0fb-8472-4c54-b574-8f8b148658bc"

[[env.staging.routes]]
pattern = "dev.milkyfrog.vip"
custom_domain = true
