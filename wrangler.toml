name = "milkyfrog-web"
main = "worker/index.js"
compatibility_date = "2026-10-31"

[assets]
directory = "."
binding = "ASSETS"

[dev]
port = 8788

[[routes]]
pattern = "milkyfrog.vip/*"
zone_name = "milkyfrog.vip"

[[d1_databases]]
binding = "DB"
database_name = "milk-frog-jump"
database_id = "0d52075b-362a-49cd-93ac-f3ecbdc59a68"

# 体验版（trial）专用环境：独立 worker + 独立 D1，测试数据不写进线上库
[env.staging]
name = "the-frog-jumps-sideways-web-staging"
main = "worker/index.js"
compatibility_date = "2026-10-31"

[env.staging.assets]
directory = "."
binding = "ASSETS"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "milk-frog-jump-staging"
database_id = "82bbcb56-2c86-474d-aa58-8d264be83b6b"

[[env.staging.routes]]
pattern = "milkyfrog-jump-dev.toolsbox.vip"
custom_domain = true
